    <g fill="#F6F6F4" stroke="#08080B" stroke-width="2.2" stroke-linejoin="miter">
      <path d="M 150.2 100 A 50.2 50.2 0 0 1 135.497 135.497 L 116.469 120.731 Z" />
      <path d="M 135.497 135.497 A 50.2 50.2 0 0 1 100 150.2 L 79.269 116.469 Z" />
      <path d="M 100 150.2 A 50.2 50.2 0 0 1 64.503 135.497 L 79.269 83.531 Z" />
