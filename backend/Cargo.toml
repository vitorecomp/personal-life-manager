[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/life-ops",
    "crates/intelligence",
    "crates/server",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
hermes-domain = { path = "crates/domain" }
hermes-life-ops = { path = "crates/life-ops" }
hermes-intelligence = { path = "crates/intelligence" }

# Pre-verified M2 external crates (0 cmake / 0 clang / 0 aws-lc-sys)
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
eventsource-stream = "0.2.3"
futures = "0.3"
hex = "0.4"
notify = "8.2.2"
pgvector = { version = "=0.4.1", features = ["sqlx", "serde"] }
rand = "0.9"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
# IMPORTANT: reqwest 0.12 rustls-tls uses `ring` (reqwest 0.13 default `rustls` pulls `aws-lc-sys` which requires `cmake`!)
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
# IMPORTANT: never enable `auth-client-credentials-jwt` on rmcp (pulls aws-lc-rs)
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde", "maths"] }
schemars = { version = "1.2.3", features = ["uuid1", "chrono04", "rust_decimal1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "derive", "uuid", "chrono", "rust_decimal", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono", "decimal"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.2", features = ["v4", "v7", "serde"] }
