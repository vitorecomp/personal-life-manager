name: hermes-os

services:
  # ===========================================================================
  # 1. PostgreSQL 16 + pgvector (Primary Relational & Vector Store)
  # ===========================================================================
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: hermes_os_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./life-manager/infra-deploy/initdb/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-hermes} -d ${POSTGRES_DB:-hermes_os}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ===========================================================================
  # 2. Redis 7 (Cache, Quote/FX Buffer & Background Coordination)
  # ===========================================================================
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: hermes_os_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  # ===========================================================================
  # 3. HERMES // OS Unified Server (Axum REST + SSE + /mcp + Static Web SPA)
  # ===========================================================================
  hermes-server:
    build:
      context: ./life-manager
      dockerfile: infra-deploy/Dockerfile
    image: localhost/hermes-os-server:latest
    container_name: hermes_os_server
    restart: unless-stopped
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@postgres:5432/${POSTGRES_DB:-hermes_os}
      REDIS_URL: redis://redis:6379
      HERMES_GATEWAY_URL: ${HERMES_GATEWAY_URL:-http://host.containers.internal:8642/v1}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      STATIC_DIST_DIR: /app/apps/web/dist
      YOUTUBE_LISTS_DB: /app/data/database/youtube-lists.sqlite
      YOUTUBE_LISTS_NOTES_DIR: /app/data/knowledge-data/lists/youtube
      SECOND_BRAIN_DIR: /app/data/second-brain
      HERMES_ADMIN_USER: ${HERMES_ADMIN_USER:-operator}
      HERMES_ADMIN_PASSWORD: ${HERMES_ADMIN_PASSWORD:-hermes-os-local}
      HERMES_BOOTSTRAP_PAT: ${HERMES_BOOTSTRAP_PAT:-}
      REQUIRE_WEB_LOGIN: ${REQUIRE_WEB_LOGIN:-false}
    ports:
      - "${HERMES_SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: "curl -fsS http://127.0.0.1:8080/api/health || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================================================
  # 5. Hermes Agent (Nous Research) - AI agent over the second brain vault
  # ===================================================
  # Start alone with: podman-compose up -d hermes
  # Chat:             podman exec -it hermes hermes
  # Dashboard:        http://localhost:9119 (bound to localhost only)
  hermes:
    image: docker.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    # Rootless podman: your host user becomes uid 10000 inside, the image's own `hermes` user, so
    # files the agent writes in the vault and in hermes-mds stay owned by you on the host.
    # s6-overlay's /init must start as root (it then drops every service to `hermes`).
    userns_mode: "keep-id:uid=10000,gid=10000"
    user: "0:0"
    # Every variable of the root .env (Gemini, Telegram, Notion, Taiga, ...) becomes a container env
    # var, so secrets are never written to hermes-mds (which is synced to Dropbox). Read when the
    # container is created: after editing .env, run `podman-compose up -d --force-recreate hermes`.
    env_file: .env
    environment:
      NOTION_API_TOKEN: ${NOTION_API_KEY:-}   # same key, for Notion's ntn CLI
      NOTION_KEYRING: "0"                      # ntn: read the key from the env, no keyring in a container
      OBSIDIAN_VAULT_PATH: /vault
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
    volumes:
      # Everything the agent can reach: its own state, the vault and (read-only) the crawler output.
      - ./data/database/hermes-mds:/opt/data
      - ./data/second-brain:/vault
      - ./data/knowledge-data:/knowledge:ro
    command: ["gateway", "run"]

  # ===================================================
  # 6. SilverBullet - web editor over the same vault Hermes works on
  # ===================================================
  # One-shot helper: installs the SilverBullet libraries pinned in scripts/silverbullet-libs.sh into
  # the vault when they are missing, then exits. SilverBullet picks the new files up by itself.
  silverbullet-libs:
    image: docker.io/curlimages/curl:latest
    container_name: silverbullet-libs
    restart: "no"
    user: "0:0"                        # root inside = your host user under rootless podman
    entrypoint: ["sh", "/scripts/silverbullet-libs.sh"]
    volumes:
      - ./scripts/silverbullet-libs.sh:/scripts/silverbullet-libs.sh:ro
      - ./data/second-brain:/data

  # Start alone with: podman-compose up -d silverbullet
  # Open:             http://localhost:3010 (bound to localhost only; reach it remotely via an SSH tunnel)
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: silverbullet
    restart: unless-stopped
    depends_on:
      - silverbullet-libs
    # SilverBullet runs as the owner of the folder mounted at /data. Under rootless podman your host
    # user is root inside, so the files it writes stay owned by you on the host.
    volumes:
      - ./data/second-brain:/data
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  postgres_data:
  redis_data:
