version: '3.8'

services:
  # ===================================================
  # 1. PostgreSQL with pgvector (Embeddings & Database)
  # ===================================================
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: secondbrain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondbrain_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # 2. Redis (Job Queue & Cache)
  # ===================================================
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: secondbrain_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # 3. Personal System - Golang Backend API
  # ===================================================
  personal-backend:
    build:
      context: ./personal-system/backend
      dockerfile: Dockerfile
    image: localhost/personal-system-backend:latest
    container_name: secondbrain_personal_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_FILE: /app/data/store.json
      PROBE_INTERVAL_SECONDS: 30
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    volumes:
      - personal_backend_data:/app/data
    depends_on:
      - postgres
      - redis

  # ===================================================
  # 4. Personal System - Next.js Frontend Dashboard
  # ===================================================
  personal-frontend:
    build:
      context: ./personal-system/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: localhost/personal-system-frontend:latest
    container_name: secondbrain_personal_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - personal-backend

  # ===================================================
  # 5. Hermes Agent (Nous Research) - AI agent over the second brain vault
  # ===================================================
  # Start alone with: podman-compose up -d hermes
  # Chat:             podman exec -it hermes hermes
  # Dashboard:        http://localhost:9119 (bound to localhost only)
  hermes:
    image: docker.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    # Rootless podman: your host user becomes uid 10000 inside, the image's own `hermes` user, so
    # files the agent writes in the vault and in hermes-mds stay owned by you on the host.
    # s6-overlay's /init must start as root (it then drops every service to `hermes`).
    userns_mode: "keep-id:uid=10000,gid=10000"
    user: "0:0"
    # Every variable of the root .env (Gemini, Telegram, Notion, Taiga, ...) becomes a container env
    # var, so secrets are never written to hermes-mds (which is synced to Dropbox). Read when the
    # container is created: after editing .env, run `podman-compose up -d --force-recreate hermes`.
    env_file: .env
    environment:
      NOTION_API_TOKEN: ${NOTION_API_KEY:-}   # same key, for Notion's ntn CLI
      NOTION_KEYRING: "0"                      # ntn: read the key from the env, no keyring in a container
      OBSIDIAN_VAULT_PATH: /vault
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
    volumes:
      # Everything the agent can reach: its own state, the vault and (read-only) the crawler output.
      - ./data/database/hermes-mds:/opt/data
      - ./data/second-brain:/vault
      - ./data/knowledge-data:/knowledge:ro
    command: ["gateway", "run"]

  # ===================================================
  # 6. SilverBullet - web editor over the same vault Hermes works on
  # ===================================================
  # One-shot helper: installs the SilverBullet libraries pinned in scripts/silverbullet-libs.sh into
  # the vault when they are missing, then exits. SilverBullet picks the new files up by itself.
  silverbullet-libs:
    image: docker.io/curlimages/curl:latest
    container_name: silverbullet-libs
    restart: "no"
    user: "0:0"                        # root inside = your host user under rootless podman
    entrypoint: ["sh", "/scripts/silverbullet-libs.sh"]
    volumes:
      - ./scripts/silverbullet-libs.sh:/scripts/silverbullet-libs.sh:ro
      - ./data/second-brain:/data

  # Start alone with: podman-compose up -d silverbullet
  # Open:             http://localhost:3010 (bound to localhost only; reach it remotely via an SSH tunnel)
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:latest
    container_name: silverbullet
    restart: unless-stopped
    depends_on:
      - silverbullet-libs
    # SilverBullet runs as the owner of the folder mounted at /data. Under rootless podman your host
    # user is root inside, so the files it writes stay owned by you on the host.
    volumes:
      - ./data/second-brain:/data
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  postgres_data:
  redis_data:
  personal_backend_data:
