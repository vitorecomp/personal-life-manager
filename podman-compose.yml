version: '3.8'

services:
  # ===================================================
  # 1. PostgreSQL with pgvector (Embeddings & Database)
  # ===================================================
  postgres:
    image: docker.io/pgvector/pgvector:pg16
    container_name: secondbrain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secondbrain_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # 2. Redis (Job Queue & Cache)
  # ===================================================
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: secondbrain_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================
  # 3. Personal System - Golang Backend API
  # ===================================================
  personal-backend:
    build:
      context: ./personal-system/backend
      dockerfile: Dockerfile
    image: localhost/personal-system-backend:latest
    container_name: secondbrain_personal_backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DATA_FILE: /app/data/store.json
      PROBE_INTERVAL_SECONDS: 30
      CORS_ORIGIN: "*"
    ports:
      - "8080:8080"
    volumes:
      - personal_backend_data:/app/data
    depends_on:
      - postgres
      - redis

  # ===================================================
  # 4. Personal System - Next.js Frontend Dashboard
  # ===================================================
  personal-frontend:
    build:
      context: ./personal-system/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    image: localhost/personal-system-frontend:latest
    container_name: secondbrain_personal_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - personal-backend

  # ===================================================
  # 5. Hermes Agent (Nous Research) - AI agent over the second brain vault
  # ===================================================
  # Start alone with: podman-compose up -d hermes
  # Chat:             podman exec -it hermes /opt/hermes/.venv/bin/hermes
  # Dashboard:        http://localhost:9119 (bound to localhost only)
  hermes:
    image: docker.io/nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    # Rootless podman: keep-id maps container uid 1000 to your host user, and s6-overlay's /init
    # (which must run as root inside) drops every service to HERMES_UID, so files the agent writes
    # in the vault and in hermes-mds stay owned by you on the host.
    userns_mode: keep-id
    user: "0:0"
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Taken from the root .env, never written to hermes-mds (which is synced to Dropbox).
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Telegram (polling, no open port needed); only the numeric user IDs listed can talk to it.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      # Notion (bundled notion skill); it only sees the pages shared with the integration.
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_API_TOKEN: ${NOTION_API_KEY:-}   # same key, for Notion's ntn CLI
      NOTION_KEYRING: "0"                      # ntn: read the key from the env, no keyring in a container
      OBSIDIAN_VAULT_PATH: /vault
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
    volumes:
      # Everything the agent can reach: its own state, the vault and (read-only) the crawler output.
      - ./data/database/hermes-mds:/opt/data
      - ./data/second-brain:/vault
      - ./data/knowledge-data:/knowledge:ro
    command: ["gateway", "run"]

  # ===================================================
  # 6. Obsidian (web) - the same vault Hermes works on, in the browser
  # ===================================================
  # Start alone with: podman-compose up -d obsidian
  # Open:             https://localhost:3010 (self-signed certificate), then "Open folder as vault" -> /vault
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    restart: unless-stopped
    # Same uid mapping as hermes: files edited here stay owned by your host user.
    userns_mode: keep-id
    user: "0:0"
    environment:
      PUID: ${HERMES_UID:-1000}
      PGID: ${HERMES_GID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - obsidian_config:/config        # app settings and the list of opened vaults
      - ./data/second-brain:/vault
    ports:
      # HTTPS only (the image needs a secure context) and localhost only: this is a full remote desktop.
      - "127.0.0.1:3010:3001"
    shm_size: "1gb"                    # Electron needs it

volumes:
  postgres_data:
  redis_data:
  personal_backend_data:
  obsidian_config:
